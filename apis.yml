aid: xpertsea
name: Xpertsea
description: >-
  Xpertsea is an aquaculture technology company (backed by QED Investors) that
  has rebranded its product as Kampi (bekampi.com) — an AI-powered shrimp-farming
  management app used by producers in Ecuador to monitor ponds, track growth and
  feed, and make production decisions in real time from mobile and web apps.
  xpertsea.com now 301-redirects to bekampi.com. The company publishes no public
  developer program or API surface: no docs/api/developer subdomains, no OpenAPI,
  and no API client SDKs (its @xpertsea npm scope holds two 2022-era UI-component
  forks). bekampi.com does publish an llms.txt, captured in this repository.
